name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  javascript:
    name: TypeScript, tests, and portable builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @bezi-remote/protocol build
      - run: pnpm --filter @bezi-remote/relay build
      - run: pnpm --filter @bezi-remote/mobile build
      - run: pnpm --filter @bezi-remote/companion build:ui

  windows-companion:
    name: Windows companion
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/companion/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo test --locked

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
