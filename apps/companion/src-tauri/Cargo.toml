[package]
name = "bezi-remote-companion"
version = "0.1.0"
description = "Secure Windows companion for Bezi Remote"
authors = ["Bezi Remote"]
edition = "2021"

[lib]
name = "bezi_remote_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
native-streaming = [
  "dep:gstreamer",
  "dep:gstreamer-sdp",
  "dep:gstreamer-webrtc"
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
futures-util = "0.3"
gstreamer = { version = "0.25.2", features = ["v1_28"], optional = true }
gstreamer-sdp = { version = "0.25.2", optional = true }
gstreamer-webrtc = { version = "0.25.2", features = ["v1_28"], optional = true }
hkdf = "0.12"
keyring = { version = "3", features = ["windows-native"] }
memchr = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }
